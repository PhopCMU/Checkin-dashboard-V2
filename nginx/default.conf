server {
    listen 80;
    server_name _;

    # ตรงกับ volume ใน docker-compose
    root /var/www/html;
    index index.html;

    # บังคับใส่ท้ายด้วย / ที่ /admin (ป้องกัน relative path เพี้ยน)
    location = /admin {
        return 301 /admin/;
    }

    # 1) map /admin/assets → /var/www/html/assets (ระวังเรื่อง alias ต้องลงท้ายด้วย / และ location ก็ต้องลงท้ายด้วย /)
    location ^~ /admin/assets/ {
        alias /var/www/html/assets/;
        try_files $uri =404;

        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2) SPA fallback ใต้ /admin/ เท่านั้น
    #    - ถ้าไฟล์มีจริง ให้เสิร์ฟไฟล์
    #    - ถ้าไม่มีก็ส่ง /index.html เพื่อให้ client-side router จัดการ
    location ^~ /admin/ {
        try_files $uri $uri/ /index.html;
    }

    # 3) (ทางเลือก) cache static ทั่วไปนอก /admin/assets/
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
